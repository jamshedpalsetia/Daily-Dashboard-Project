# Production stack for the Ubuntu server. Self-contained, so run it with:
#   docker compose -f docker-compose.prod.yml up -d --build
# The frontend is built to static files and served by nginx, which also proxies
# /api to the API container, so the browser only ever talks to one origin.

name: daily-dashboard

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dashboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-dashboard}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dashboard} -d ${POSTGRES_DB:-dashboard}"]
      interval: 10s
      timeout: 6s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # SMTP_* and the other app settings come from .env (gitignored).
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dashboard}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dashboard}
      DASHBOARD_URL: ${DASHBOARD_URL:-http://localhost:8080}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      TZ: ${TZ:-America/Los_Angeles}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    environment:
      TZ: ${TZ:-America/Los_Angeles}
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  db_data:
